schema_id: studio.validation_result
schema_version: "0.1.0"
description: Descriptive schema for Studio-readable validation results over SDLC and Cursor artifacts.
type: object
required:
  - validation
properties:
  validation:
    type: object
    required:
      - id
      - target_ref
      - check_type
      - status
      - messages
      - source_refs
    properties:
      id:
        type: string
      target_ref:
        type: string
        description: Registry entity, graph, or workflow reference being checked.
      check_type:
        type: string
        enum:
          - yaml_parse
          - path_exists
          - path_scope
          - relationship_target
          - doctor
          - lint
          - policy
          - custom
      status:
        type: string
        enum:
          - pass
          - warn
          - fail
          - not_run
      messages:
        type: array
        items:
          type: object
          required:
            - level
            - text
          properties:
            level:
              type: string
              enum:
                - info
                - warn
                - error
            text:
              type: string
            path:
              type: string
      source_refs:
        type: array
        description: Existing .sdlc/ or .cursor/ paths that supplied validation context.
        items:
          type: string
      checked_by:
        type: string
      checked_at:
        type: string
        format: date-time
additionalProperties: false
