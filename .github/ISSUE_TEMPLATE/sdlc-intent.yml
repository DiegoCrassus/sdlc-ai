name: SDLC Intent
description: Nova intenção de trabalho — início do ciclo SDLC AI-native
title: "[Intent] "
labels:
  - sdlc:intent
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Use o template em `.sdlc/templates/intent.md`. Fases em `.sdlc/phases.yaml`.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que motiva esta mudança?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: O que entra neste trabalho?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora de escopo
  - type: checkboxes
    id: sdlc_phases
    attributes:
      label: Fases SDLC previstas
      options:
        - label: spec (specs/ ou .sdlc/)
        - label: compile (rpg compile)
        - label: implement (backend/apps/services)
        - label: eval (agent evals)
