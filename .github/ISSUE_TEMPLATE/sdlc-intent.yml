name: SDLC Intent
description: Nova intenção de trabalho — início do ciclo SDLC AI-native
title: "[Intent] "
labels:
  - sdlc:intent
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Use GitHub issues para espelhar contexto quando necessário.
        O workflow de branch/PR começa por uma task Plane `RPG-N`.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que motiva esta mudança?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: O que entra neste trabalho?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora de escopo
  - type: checkboxes
    id: sdlc_phases
    attributes:
      label: Fases SDLC previstas
      options:
        - label: Plane task criada e linkada
        - label: branch feature/RPG-N ou bugfix/RPG-N
        - label: implement
        - label: lint/test Actions obrigatórios
