name: SDLC

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

jobs:
  sdlc-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    env:
      LANGSMITH_API_KEY:   ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING:   ${{ vars.LANGSMITH_TRACING }}
      LANGSMITH_ENDPOINT:  ${{ vars.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT:   ${{ vars.LANGSMITH_PROJECT }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      AGENT_MODEL:         ${{ secrets.AGENT_MODEL }}
      # PATs — use SDLC_PAT_CLASSIC para operacoes que precisam de token com scopes completos
      SDLC_PAT_CLASSIC:    ${{ secrets.SDLC_PAT_CLASSIC }}

    env:
      LANGSMITH_API_KEY:   ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING:   ${{ vars.LANGSMITH_TRACING }}
      LANGSMITH_ENDPOINT:  ${{ vars.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT:   ${{ vars.LANGSMITH_PROJECT }}
      OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
      AGENT_MODEL:         ${{ secrets.AGENT_MODEL }}
      # PATs — use SDLC_PAT_CLASSIC para operacoes que precisam de token com scopes completos
      SDLC_PAT_CLASSIC:    ${{ secrets.SDLC_PAT_CLASSIC }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rpg_dsl
        working-directory: .
        run: pip install -e packages/rpg_dsl

      - name: SDLC validate
        working-directory: .
        run: python -m rpg_dsl._cli validate specs/

      - name: Backend smoke import check
        run: python -c "from app.main import app; print('app ok', app.title)"

      - name: Pytest (when tests exist)
        run: |
          pip install pytest pytest-asyncio httpx 2>/dev/null || true
          if [ -d tests ]; then pytest tests/ -q; else echo "skip: no tests/ yet"; fi
        continue-on-error: true
