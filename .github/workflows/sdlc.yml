name: SDLC

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  sdlc-gates:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    env:
      LANGSMITH_API_KEY:  ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING:  ${{ vars.LANGSMITH_TRACING }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT:  ${{ vars.LANGSMITH_PROJECT }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      SDLC_PAT_CLASSIC:   ${{ secrets.SDLC_PAT_CLASSIC }}

    outputs:
      pytest_failed: ${{ steps.pytest.outputs.failed }}
      pytest_errors: ${{ steps.pytest.outputs.errors }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test extras
        run: pip install pytest pytest-asyncio httpx

      - name: Backend import check
        run: python -c "from app.main import app; print('app ok', app.title)"

      - name: Pytest
        id: pytest
        working-directory: .
        run: |
          set +e
          OUTPUT=$(python -m pytest tests/ -q 2>&1)
          EXIT=$?
          echo "failed=$( [ $EXIT -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT
          echo "$OUTPUT"
          exit $EXIT
        continue-on-error: true

  open-test-issue-and-fix:
    name: Open issue + trigger fix
    runs-on: ubuntu-latest
    needs: [sdlc-gates]
    if: needs.sdlc-gates.outputs.pytest_failed == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test-fail issue
        id: create-issue
        env:
          SDLC_PAT_CLASSIC: ${{ secrets.SDLC_PAT_CLASSIC }}
          REPO:             ${{ github.repository }}
          COMMIT_SHA:       ${{ github.sha }}
          COMMIT_MSG:       ${{ github.event.head_commit.message || github.event.pull_request.title }}
          BRANCH:           ${{ github.ref_name }}
          CHECK_KIND:       test
          ERRORS:           ${{ needs.sdlc-gates.outputs.pytest_errors }}
          RUN_URL:          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/open_quality_issue.py

      - name: Trigger quality-fix agent
        if: steps.create-issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            const branch = context.payload.pull_request?.head?.ref ?? context.ref.replace('refs/heads/', '')
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                workflow_id: 'lint-fix.yml',
                ref: branch,
                inputs: {
                  branch,
                  issue_number: '${{ steps.create-issue.outputs.issue_number }}',
                  commit_sha:   '${{ github.sha }}'
                }
              })
            } catch (error) {
              core.warning(`lint-fix dispatch skipped: ${error.message}`)
            }

  test-gate:
    name: Test gate
    runs-on: ubuntu-latest
    needs: [sdlc-gates]
    if: always()
    steps:
      - name: Fail if tests failed
        if: needs.sdlc-gates.outputs.pytest_failed == 'true'
        run: |
          echo "Tests failed — blocking merge."
          exit 1
      - name: Tests passed
        run: echo "All tests green."
