name: Quality Fix Agent

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch da PR com falha de lint/teste"
        required: true
        default: develop
      issue_number:
        description: "Número da issue sdlc:lint-fail"
        required: false
        default: ""
      commit_sha:
        description: "SHA do commit que falhou"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-fix:
    name: Resolve quality failure
    runs-on: ubuntu-latest

    env:
      SDLC_PAT_CLASSIC: ${{ secrets.SDLC_PAT_CLASSIC }}
      GH_TOKEN:         ${{ secrets.SDLC_PAT_CLASSIC }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref:   ${{ inputs.branch }}
          token: ${{ secrets.SDLC_PAT_CLASSIC }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff fix
        id: ruff-fix
        run: |
          ruff check --fix --unsafe-fixes apps/backend/ .cursor/hooks/ .github/scripts/ || true
          ruff format apps/backend/ .cursor/hooks/ .github/scripts/ || true

          set +e
          CHECK_OUTPUT=$(ruff check apps/backend/ .cursor/hooks/ .github/scripts/ 2>&1)
          CHECK_EXIT=$?
          FORMAT_OUTPUT=$(ruff format --check apps/backend/ .cursor/hooks/ .github/scripts/ 2>&1)
          FORMAT_EXIT=$?
          REMAINING="${CHECK_OUTPUT}"$'\n'"${FORMAT_OUTPUT}"
          STILL_FAILING=$( [ $CHECK_EXIT -ne 0 ] || [ $FORMAT_EXIT -ne 0 ] && echo true || echo false )
          ESCAPED="${REMAINING//$'\n'/'%0A'}"
          echo "still_failing=${STILL_FAILING}" >> $GITHUB_OUTPUT
          echo "remaining=${ESCAPED}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package.json

      - name: npm install
        working-directory: apps/frontend
        run: npm install

      - name: frontend build/typecheck
        id: tsc-check
        working-directory: apps/frontend
        run: |
          set +e
          OUTPUT=$(npm run build 2>&1)
          EXIT=$?
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "failed=$( [ $EXIT -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT

      - name: Install backend test dependencies
        run: pip install -r apps/backend/requirements.txt pytest pytest-asyncio httpx

      - name: pytest check
        id: pytest-check
        env:
          PYTHONPATH: apps/backend
        run: |
          set +e
          OUTPUT=$(pytest tests/ -q 2>&1)
          EXIT=$?
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "failed=$( [ $EXIT -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit auto-fix to PR branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "sdlc-lint-bot"
          git config user.email "sdlc-lint-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply automated quality correction

          Triggered by issue-resolver workflow on branch ${{ inputs.branch }}.
          Issue: #${{ inputs.issue_number }}"
          git push origin "HEAD:${{ inputs.branch }}"

      - name: Comment on issue — fix pushed
        if: |
          inputs.issue_number != '' &&
          steps.changes.outputs.changed == 'true' &&
          steps.ruff-fix.outputs.still_failing == 'false' &&
          steps.tsc-check.outputs.failed == 'false' &&
          steps.pytest-check.outputs.failed == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body: `### Correção automática enviada

            Foi feito push de uma correção mínima para \`${{ inputs.branch }}\`.
            As Actions devem rodar novamente no PR. Esta issue só deve ser fechada após checks verdes no head SHA mais recente.`
            })

      - name: Comment on issue — partial / blocked
        if: |
          inputs.issue_number != '' &&
          (steps.ruff-fix.outputs.still_failing == 'true' || steps.tsc-check.outputs.failed == 'true' || steps.pytest-check.outputs.failed == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            const pyErr  = '${{ steps.ruff-fix.outputs.remaining }}'.replace(/%0A/g, '\n')
            const tsErr  = '${{ steps.tsc-check.outputs.errors }}'.replace(/%0A/g, '\n')
            const changed = '${{ steps.changes.outputs.changed }}' === 'true'

            let body = `### Auto-fix parcial — intervencao necessaria\n\n`
            if (changed) body += `Algumas correcoes foram aplicadas mas erros persistem.\n\n`
            if (pyErr.trim())  body += `**Python (ruff):**\n\`\`\`\n${pyErr.trim()}\n\`\`\`\n\n`
            if (tsErr.trim())  body += `**TypeScript (tsc):**\n\`\`\`\n${tsErr.trim()}\n\`\`\`\n\n`
            const testErr = '${{ steps.pytest-check.outputs.errors }}'.replace(/%0A/g, '\n')
            if (testErr.trim()) body += `**Unit tests (pytest):**\n\`\`\`\n${testErr.trim()}\n\`\`\`\n\n`
            body += `> Corrija manualmente e remova a label \`sdlc:blocked\` apos resolver.`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body
            })
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              labels: ['sdlc:blocked']
            })
