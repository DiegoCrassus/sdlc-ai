name: Lint Fix Agent

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch com erros de lint"
        required: true
        default: develop
      issue_number:
        description: "Número da issue sdlc:lint-fail"
        required: false
        default: ""
      commit_sha:
        description: "SHA do commit que falhou"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-fix:
    name: Auto-fix lint errors
    runs-on: ubuntu-latest

    env:
      SDLC_PAT_CLASSIC: ${{ secrets.SDLC_PAT_CLASSIC }}
      GH_TOKEN:         ${{ secrets.SDLC_PAT_CLASSIC }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref:   ${{ inputs.branch }}
          token: ${{ secrets.SDLC_PAT_CLASSIC }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # --- Python auto-fix ---
      - name: ruff fix
        id: ruff-fix
        run: |
          ruff check --fix --unsafe-fixes backend/ packages/rpg_dsl/ specs/ .cursor/hooks/ || true
          ruff format backend/ packages/rpg_dsl/ specs/ .cursor/hooks/ || true

          # Verifica se ainda há erros após o fix
          set +e
          REMAINING=$(ruff check backend/ packages/rpg_dsl/ specs/ .cursor/hooks/ 2>&1)
          STILL_FAILING=$( [ $? -ne 0 ] && echo true || echo false )
          ESCAPED="${REMAINING//$'\n'/'%0A'}"
          echo "still_failing=${STILL_FAILING}" >> $GITHUB_OUTPUT
          echo "remaining=${ESCAPED}" >> $GITHUB_OUTPUT

      # --- TypeScript fix (tsc não tem auto-fix; apenas reporta) ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: npm install (TypeScript check)
        working-directory: apps/web
        run: npm install

      - name: tsc --noEmit (check remaining)
        id: tsc-check
        working-directory: apps/web
        run: |
          set +e
          OUTPUT=$(npx tsc --noEmit 2>&1)
          EXIT=$?
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "failed=$( [ $EXIT -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT

      # --- Commit e PR se houve mudanças ---
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit auto-fix
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "sdlc-lint-bot"
          git config user.email "sdlc-lint-bot@users.noreply.github.com"
          git checkout -b "fix/lint-${{ inputs.commit_sha || github.run_id }}"
          git add -A
          git commit -m "fix(lint): auto-fix ruff errors [bot]

          Triggered by lint-fix agent on branch ${{ inputs.branch }}.
          Issue: #${{ inputs.issue_number }}"
          git push origin "fix/lint-${{ inputs.commit_sha || github.run_id }}"

      - name: Create PR with fix
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            const issueRef = '${{ inputs.issue_number }}' ? `\nCloses #${{ inputs.issue_number }}` : ''
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'fix(lint): auto-fix ruff errors [bot]',
              body: `## Auto-fix de lint

            Erros corrigidos automaticamente pelo agente \`lint-fix\`.

            **Branch original:** \`${{ inputs.branch }}\`
            **Commit:** \`${{ inputs.commit_sha }}\`

            ## SDLC
            - [x] Auto-fix ruff aplicado
            - [ ] Revisar se há erros restantes (TypeScript / ruff não-auto-fixáveis)
            ${issueRef}`,
              head: 'fix/lint-${{ inputs.commit_sha || github.run_id }}',
              base: '${{ inputs.branch }}'
            })
            core.setOutput('pr_number', pr.data.number)

      # --- Comentar na issue ---
      - name: Comment on issue — fixed
        if: |
          inputs.issue_number != '' &&
          steps.changes.outputs.changed == 'true' &&
          steps.ruff-fix.outputs.still_failing == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body: `### Lint fix concluido

            Erros corrigidos automaticamente. PR aberto para revisao.
            Verifique o PR e aprove o merge se estiver correto.`
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              state: 'closed'
            })

      - name: Comment on issue — partial / blocked
        if: |
          inputs.issue_number != '' &&
          (steps.ruff-fix.outputs.still_failing == 'true' || steps.tsc-check.outputs.failed == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            const pyErr  = '${{ steps.ruff-fix.outputs.remaining }}'.replace(/%0A/g, '\n')
            const tsErr  = '${{ steps.tsc-check.outputs.errors }}'.replace(/%0A/g, '\n')
            const changed = '${{ steps.changes.outputs.changed }}' === 'true'

            let body = `### Auto-fix parcial — intervencao necessaria\n\n`
            if (changed) body += `Algumas correcoes foram aplicadas mas erros persistem.\n\n`
            if (pyErr.trim())  body += `**Python (ruff):**\n\`\`\`\n${pyErr.trim()}\n\`\`\`\n\n`
            if (tsErr.trim())  body += `**TypeScript (tsc):**\n\`\`\`\n${tsErr.trim()}\n\`\`\`\n\n`
            body += `> Corrija manualmente e remova a label \`sdlc:blocked\` apos resolver.`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body
            })
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              labels: ['sdlc:blocked']
            })
