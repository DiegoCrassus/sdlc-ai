name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, staging, develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  lint-python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.ruff.outputs.failed }}
      errors: ${{ steps.ruff.outputs.errors }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        id: ruff
        run: |
          set +e
          OUTPUT=$(ruff check apps/backend/ .github/scripts/ .cursor/hooks/ 2>&1)
          EXIT_CHECK=$?
          OUTPUT2=$(ruff format --check apps/backend/ .github/scripts/ .cursor/hooks/ 2>&1)
          EXIT_FMT=$?
          FINAL=$([ $EXIT_CHECK -ne 0 ] || [ $EXIT_FMT -ne 0 ] && echo 1 || echo 0)
          COMBINED="${OUTPUT}"$'\n'"${OUTPUT2}"
          echo "failed=$( [ $FINAL -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          ESCAPED="${COMBINED//$'\n'/'%0A'}"
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT
          echo "$COMBINED"
          if [ $FINAL -ne 0 ]; then
            echo "### ruff errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$COMBINED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $FINAL
        continue-on-error: true

  lint-typescript:
    name: TypeScript (tsc)
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.tsc.outputs.failed }}
      errors: ${{ steps.tsc.outputs.errors }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm install

      - name: tsc --noEmit
        id: tsc
        working-directory: apps/frontend
        run: |
          set +e
          OUTPUT=$(npx tsc --noEmit 2>&1)
          EXIT=$?
          echo "failed=$( [ $EXIT -ne 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          ESCAPED="${OUTPUT//$'\n'/'%0A'}"
          echo "errors=${ESCAPED}" >> $GITHUB_OUTPUT
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            echo "### tsc errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT
        continue-on-error: true

  open-issue-and-fix:
    name: Open issue + trigger fix
    runs-on: ubuntu-latest
    needs: [lint-python, lint-typescript]
    if: |
      needs.lint-python.outputs.failed == 'true' ||
      needs.lint-typescript.outputs.failed == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create lint-fail issue
        id: create-issue
        env:
          SDLC_PAT_CLASSIC: ${{ secrets.SDLC_PAT_CLASSIC }}
          REPO:             ${{ github.repository }}
          COMMIT_SHA:       ${{ github.sha }}
          COMMIT_MSG:       ${{ github.event.head_commit.message || github.event.pull_request.title }}
          BRANCH:           ${{ github.ref_name }}
          CHECK_KIND:       lint
          ERRORS:           "${{ needs.lint-python.outputs.errors }} ${{ needs.lint-typescript.outputs.errors }}"
          RUN_URL:          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/open_quality_issue.py

      - name: Trigger lint-fix agent
        if: steps.create-issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SDLC_PAT_CLASSIC }}
          script: |
            const branch = context.payload.pull_request?.head?.ref ?? context.ref.replace('refs/heads/', '')
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                workflow_id: 'lint-fix.yml',
                ref: branch,
                inputs: {
                  branch,
                  issue_number: '${{ steps.create-issue.outputs.issue_number }}',
                  commit_sha:   '${{ github.sha }}'
                }
              })
            } catch (error) {
              core.warning(`lint-fix dispatch skipped: ${error.message}`)
            }

  lint-gate:
    name: Lint gate
    runs-on: ubuntu-latest
    needs: [lint-python, lint-typescript]
    if: always()
    steps:
      - name: Fail if lint failed
        if: |
          needs.lint-python.outputs.failed == 'true' ||
          needs.lint-typescript.outputs.failed == 'true'
        run: |
          echo "Lint checks failed — blocking merge."
          exit 1
      - name: Lint passed
        run: echo "All lint checks green."
