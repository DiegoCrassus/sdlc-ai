name: SDLC CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

env:
  PYTHON_VERSION: "3.12"

jobs:

  sdlc-doctor:
    name: SDLC Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: Run SDLC Doctor
        run: python3 .sdlc/dsl/cli.py doctor
      - name: Run SDLC Audit
        run: python3 app/infra/sdlc_obs/auditor.py
        continue-on-error: true

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge-gate:
    name: Auto-Merge Gate
    needs: [sdlc-doctor, secrets-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gates
        run: |
          for result in "${{ needs.sdlc-doctor.result }}" "${{ needs.secrets-scan.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "❌ Gate failed"
              exit 1
            fi
          done
          echo "✅ ALL GATES GREEN"
