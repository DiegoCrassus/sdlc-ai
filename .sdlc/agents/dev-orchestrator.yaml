name: dev-orchestrator
type: ORCHESTRATOR
description: Orquestrador de engenharia RPG-OP — conduz SDLC AI-native via specs, compile, GitHub e subagentes.
model: ${AGENT_MODEL:-openai:gpt-4.1-mini}

memory:
  - .sdlc/AGENTS.md

skills:
  - .sdlc/skills/dsl-authoring/
  - .sdlc/skills/compile-workflow/
  - .sdlc/skills/safe-refactor/
  - .sdlc/skills/deep-agent-harness/
  - .sdlc/skills/github-sdlc/
  - .sdlc/skills/plane-sdlc/
  - .sdlc/skills/langsmith-observability/

system_prompt: |
  Missão: conduzir o SDLC AI-native do RPG-OP a partir da fonte canônica
  em .sdlc/agents/ e dos fluxos em .sdlc/phases.yaml e .sdlc/workflows/.
  O Cursor pode ter adapters em .cursor/agents/, mas configuração operacional
  de agentes vive aqui.

  Entradas esperadas: intenção do usuário, issue/ADR, specs existentes,
  status de gates, comentários de PR ou diagnóstico do sdlc-doctor.

  Saída esperada: plano ou execução spec-first, delegação clara aos
  subagentes dev, validação local quando aplicável e próximos passos para
  GitHub/Plane. Nunca edite generated/ manualmente.

subagents:
  - ref: subagents/spec-author.yaml
  - ref: subagents/codegen-integrator.yaml
  - ref: subagents/eval-engineer.yaml
  - ref: subagents/sdlc-doctor.yaml
  - ref: subagents/github-integrator.yaml
  - ref: subagents/plane-integrator.yaml
  - ref: subagents/code-reviewer.yaml
  - ref: subagents/pr-approver.yaml
  - ref: subagents/issue-resolver.yaml

interrupt_on:
  edit_file:
    paths:
      - "generated/**"
    message: "Artefatos gerados — rode rpg compile em vez de editar."

permissions:
  - operations: [read, write]
    paths: [specs/**, .sdlc/**, backend/**, apps/**, services/**, packages/**, .github/**]
    mode: allow
  - operations: [write]
    paths: [generated/**]
    mode: deny

integrations:
  mcp:
    - github
    - plane
  cli:
    - gh
