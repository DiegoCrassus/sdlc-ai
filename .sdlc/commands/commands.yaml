# SDLC command registry — RPG-OP
version: 1

agent_commands:
  start_change:
    title: Iniciar alteração com branch SDLC
    description: Cria branch feature/RPG-N ou bugfix/RPG-N, move card Plane para In Progress e prepara rastreabilidade GitHub.
    owner: dev-orchestrator
    adapter: .cursor/agents/dev-orchestrator.md
    playbook: .sdlc/commands/start-change.md
    skills:
      - .sdlc/skills/branch-naming/
      - .sdlc/skills/plane-sdlc/
      - .sdlc/skills/plane-task-creation/
      - .sdlc/skills/plane-card-execution/
      - .sdlc/skills/github-sdlc/
    inputs:
      - plane_task_identifier
      - feature ou bugfix
      - issue GitHub opcional
    outputs:
      - branch criada e checked out
      - card Plane In Progress
      - próximos passos de implementação
    guardrails:
      - Não codar em main/develop/master.
      - Não criar branch sem identificador Plane.
      - Enriquecer descrição Plane se incompleta (plane-task-creation).

  finish_change:
    title: Finalizar alteração com commit e PR
    description: Valida, commita, faz push e abre PR; atualiza Plane e delega review.
    owner: github-integrator
    adapter: .cursor/agents/subagents/github-integrator.md
    playbook: .sdlc/commands/finish-change.md
    skills:
      - .sdlc/skills/github-sdlc/
      - .sdlc/skills/branch-naming/
      - .sdlc/skills/plane-card-execution/
      - .sdlc/skills/pr-code-review/
    inputs:
      - branch atual
      - plane_task_identifier
      - mensagem de commit
      - issue GitHub opcional
    outputs:
      - commit e push
      - PR aberto ou atualizado
      - Plane In Review
      - handoff pr_code_review
    guardrails:
      - make test, make lint e make validate verdes antes de push.
      - Não mergear sem aprovação humana explícita.
      - Não marcar Plane Done antes do merge.

  plane_backlog_plan:
    title: Analisar e criar tarefas no backlog Plane
    description: Decompõe uma intenção em work items Plane acionáveis, alinhados ao SDLC e ao GitHub quando aplicável.
    owner: plane-integrator
    adapter: .cursor/agents/subagents/plane-integrator.md
    playbook: .sdlc/commands/plane-backlog-plan.md
    skills:
      - .sdlc/skills/plane-sdlc/
      - .sdlc/skills/github-sdlc/
    inputs:
      - intent
      - contexto de produto ou negócio
      - links de issues/PRs quando existirem
    outputs:
      - backlog analisado
      - work items Plane propostos ou criados
      - comentários/links de rastreabilidade
    guardrails:
      - Não deletar work items sem confirmação humana.
      - Não expor PLANE_API_KEY.
      - Plane guarda contexto, decisões, links e documentação de produto.

  technical_documentation:
    title: Criar ou atualizar documentação técnica
    description: Produz documentação técnica versionada no repo a partir de specs, arquitetura, decisões e diffs.
    owner: spec-author
    adapter: .cursor/agents/subagents/spec-author.md
    playbook: .sdlc/commands/technical-documentation.md
    skills:
      - .sdlc/skills/dsl-authoring/
      - .sdlc/skills/deep-agent-harness/
      - .sdlc/skills/safe-refactor/
    inputs:
      - mudança técnica
      - specs e arquitetura impactadas
      - decisões ou ADRs existentes
    outputs:
      - docs técnicos atualizados
      - links para specs/código
      - lacunas ou próximos passos
    guardrails:
      - Documentar comportamento e contratos, não copiar implementação inteira.
      - Não editar generated/ manualmente.
      - Preferir docs versionados em docs/ ou .sdlc/ quando forem decisões de engenharia.

  architecture_documentation:
    title: Documentar arquitetura do projeto
    description: Mantém a arquitetura alvo do monorepo, Makefile, infra, migrations, testes e espelho Plane Infrastructure.
    owner: spec-author
    adapter: .cursor/agents/subagents/spec-author.md
    playbook: .sdlc/commands/architecture-documentation.md
    skills:
      - .sdlc/skills/plane-sdlc/
      - .sdlc/skills/plane-task-creation/
      - .sdlc/skills/safe-refactor/
    inputs:
      - decisão arquitetural
      - estrutura real do repositório
      - documentação Plane Infrastructure
      - requisitos de execução local
    outputs:
      - docs/infrastructure/project-architecture.md atualizado
      - página Plane Infrastructure sincronizada
      - Makefile e estrutura local alinhados
      - pendências de migração documentadas
    guardrails:
      - Plane Infrastructure é a fonte colaborativa de verdade.
      - Não tratar backend/ e apps/web/ como arquitetura final.
      - Usar uv para dependências e comandos Python.
      - Registrar gaps de migração em vez de esconder drift.

  business_documentation:
    title: Criar ou atualizar documentação de negócio
    description: Converte intenção, escopo e decisões de produto em documentação de negócio clara e rastreável.
    owner: plane-integrator
    adapter: .cursor/agents/subagents/plane-integrator.md
    playbook: .sdlc/commands/business-documentation.md
    skills:
      - .sdlc/skills/plane-sdlc/
      - .sdlc/skills/github-sdlc/
    inputs:
      - objetivo de negócio
      - personas ou usuários impactados
      - critérios de sucesso
      - links de backlog/issue quando existirem
    outputs:
      - documentação de negócio em Plane Page ou docs/
      - resumo executivo
      - escopo, não escopo e critérios de aceitação
    guardrails:
      - Não duplicar specs técnicas completas no Plane.
      - Linkar fontes canônicas no repo.
      - Separar decisão de negócio de detalhe de implementação.

  plane_card_execution:
    title: Executar card Plane com evidência
    description: Move work items Plane durante execução, registra evidências e mantém rastreabilidade GitHub/SDLC.
    owner: plane-integrator
    adapter: .cursor/agents/subagents/plane-integrator.md
    playbook: .sdlc/commands/plane-card-execution.md
    skills:
      - .sdlc/skills/plane-card-execution/
      - .sdlc/skills/plane-sdlc/
      - .sdlc/skills/github-sdlc/
    inputs:
      - Plane work item identifier
      - branch ou issue relacionada
      - evidências de validação
    outputs:
      - card movido para estado correto
      - comentário de evidência no Plane
      - links GitHub atualizados
    guardrails:
      - Mover para In Progress antes de executar.
      - Mover para Done apenas com aceite satisfeito.
      - Criar skill/command se faltar procedimento.

  pr_code_review:
    title: Revisar PR SDLC
    description: Revisa PRs no momento da criação ou atualização, priorizando bugs, riscos, testes e aderência ao SDLC.
    owner: code-reviewer
    adapter: .cursor/agents/subagents/code-reviewer.md
    playbook: .sdlc/commands/pr-code-review.md
    skills:
      - .sdlc/skills/pr-code-review/
      - .sdlc/skills/github-sdlc/
      - .sdlc/skills/plane-card-execution/
    inputs:
      - PR URL ou número
      - issue e cards Plane relacionados
    outputs:
      - comentário de review
      - bloqueios ou aprovação recomendada
      - issue corretiva quando aplicável
    guardrails:
      - Não aprovar PR com checks falhos.
      - Não aprovar branch fora de feature/RPG-N ou bugfix/RPG-N.
      - Não aprovar PR sem task Plane e Actions verdes.

  pr_approval_watch:
    title: Acompanhar aprovação e Actions do PR
    description: Após aprovação humana ou PR pronta para develop, acompanha Actions até verde e registra evidências.
    owner: pr-approver
    adapter: .cursor/agents/subagents/pr-approver.md
    playbook: .sdlc/commands/pr-approval-watch.md
    skills:
      - .sdlc/skills/pr-approval-watch/
      - .sdlc/skills/github-sdlc/
      - .sdlc/skills/plane-card-execution/
    inputs:
      - PR URL ou número
      - branch base
      - cards Plane relacionados
    outputs:
      - checks acompanhados
      - evidência registrada
      - handoff para issue-resolver em falha
    guardrails:
      - Não burlar branch protection.
      - Não encerrar com Actions pendentes.
      - Não mergear sem aprovação humana explícita.

  issue_resolution:
    title: Resolver issue gerada por CI/hook/review
    description: Triagem e correção autônoma de issues geradas por lint, Actions, hooks ou revisão.
    owner: issue-resolver
    adapter: .cursor/agents/subagents/issue-resolver.md
    playbook: .sdlc/commands/issue-resolution.md
    skills:
      - .sdlc/skills/issue-resolution/
      - .sdlc/skills/github-sdlc/
      - .sdlc/skills/plane-card-execution/
    inputs:
      - issue URL ou número
      - run/PR/branch relacionados
    outputs:
      - causa raiz
      - correção ou PR
      - evidência e fechamento da issue
    guardrails:
      - Não fechar issue sem evidência.
      - Não enfraquecer checks para passar CI.

  issue_resolution_validation:
    title: Validar resolução de issue até develop
    description: Valida fix de issue após resolução, reaciona code-reviewer, confere Actions e prepara merge em develop com aprovação humana.
    owner: pr-approver
    adapter: .cursor/agents/subagents/pr-approver.md
    playbook: .sdlc/commands/issue-resolution-validation.md
    skills:
      - .sdlc/skills/issue-resolution-validation/
      - .sdlc/skills/pr-code-review/
      - .sdlc/skills/pr-approval-watch/
      - .sdlc/skills/github-sdlc/
      - .sdlc/skills/plane-card-execution/
    inputs:
      - issue URL ou número
      - PR URL ou número
      - Plane card relacionado
    outputs:
      - validação pós-correção
      - aprovação humana confirmada, merge em develop ou comentário de bloqueio
      - issue fechada ou justificativa para permanecer aberta
    guardrails:
      - Validar somente contra o head SHA atual.
      - Não mergear em main/staging diretamente.
      - Não mergear sem aprovação humana explícita.
      - Comentar motivo quando não houver merge.

local:
  branch_start:
    script: .sdlc/scripts/gh-branch-start.sh
    requires: [git]
    description: Create SDLC branch feature/RPG-N or bugfix/RPG-N from develop

  validate:
    script: .sdlc/scripts/validate.sh
    description: Run SDLC gates locally before push

  issue_intent:
    script: .sdlc/scripts/gh-issue-intent.sh
    requires: [gh]
    description: Create GitHub issue from SDLC intent

  pr_open:
    script: .sdlc/scripts/gh-pr-open.sh
    requires: [gh]
    description: Open PR with SDLC checklist body

  sdlc_status:
    script: .sdlc/scripts/gh-sdlc-status.sh
    requires: [gh]
    description: List open SDLC-tagged issues

github_cli:
  auth: gh auth login
  issue_list: gh issue list --label sdlc:ci-fail
  pr_checks: gh pr checks
  run_list: gh run list --workflow=sdlc.yml
  repo_view: gh repo view

mcp:
  config: .cursor/mcp.json
  servers:
    github:
      skill: .sdlc/skills/github-sdlc/SKILL.md
    plane:
      skill: .sdlc/skills/plane-sdlc/SKILL.md

ci:
  workflow: .github/workflows/sdlc.yml
  triggers: [pull_request, push]

lint:
  check_python:
    command: ["ruff", "check", "apps/backend/", ".cursor/hooks/"]
    description: Verifica erros Python com ruff
  fix_python:
    command: ["ruff", "check", "--fix", "--unsafe-fixes", "apps/backend/", ".cursor/hooks/"]
    description: Auto-corrige erros Python com ruff
  format_python:
    command: ["ruff", "format", "apps/backend/", ".cursor/hooks/"]
    description: Formata codigo Python
  check_typescript:
    command: ["npm", "run", "build"]
    cwd: apps/frontend
    description: Verifica erros TypeScript
  trigger_fix_agent:
    description: Dispara o agente de correção no GitHub Actions
    github_workflow: lint-fix.yml
    inputs: [branch, issue_number, commit_sha]
    command: >
      gh workflow run lint-fix.yml
      --field branch=<BRANCH>
      --field issue_number=<ISSUE>
      --field commit_sha=<SHA>
