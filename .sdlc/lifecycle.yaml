version: "1.0"
description: AI-Native SDLC lifecycle — 10 stages from idea to auto-fix.

stages:
  - id: ticket
    name: Ticket / Idea
    order: 1
    description: Capture request, business intent, constraints, and acceptance criteria.

  - id: requirements
    name: Requirements
    order: 2
    description: Refine scope, rules, assumptions, risks, and non-goals.

  - id: architecture
    name: Architecture
    order: 3
    description: Define technical approach, boundaries, trade-offs, and impacted areas.

  - id: implementation
    name: Implementation
    order: 4
    description: Implement through scoped tasks using deterministic rules.

  - id: validation
    name: Validation
    order: 5
    description: Run tests, checks, QA notes, and evidence collection.

  - id: review
    name: PR & Review
    order: 6
    description: Review diffs, risks, security, maintainability, and regression impact.

  - id: deployment
    name: Deployment
    order: 7
    description: Prepare safe release, rollback notes, and environment assumptions.

  - id: observability
    name: Observability
    order: 8
    description: Define logs, metrics, traces, dashboards, and expected signals.

  - id: incident
    name: Incident
    order: 9
    description: Capture diagnosis, mitigation, communication, and post-mortem.

  - id: autofix
    name: Auto Fix
    order: 10
    description: Suggest or prepare corrective changes using evidence from previous stages.
