version: "2.0"
description: SDLC agent manifest — catalog of agents, skills, MCPs, commands, and conventions.

# ─────────────────────────────────────────────
# PROJECT IDENTITY
# ─────────────────────────────────────────────
project:
  repository: sdlc-ai
  github: DiegoCrassus/sdlc-ai
  plane_workspace: investments-sdlc
  plane_project: investiments
  plane_cards_prefix: INVES
  sdlc_version: "2.0"
  default_branch: develop

# ─────────────────────────────────────────────
# READING ORDER (agent context loading)
# ─────────────────────────────────────────────
reading_order:
  - file: AGENTS.md
    note: L0 manifest — required first; decision tree + delegation matrix
  - file: docs/sdlc/master-workflow.md
    note: Approved P0/P1 full process
  - file: docs/sdlc/change-lifecycle.md
    note: Gitflow + Plane — authority for branch and merge
  - file: .sdlc/manifest.yaml
    note: This file — agent/skill catalog
  - file: .sdlc/memory/operational-context.md
    note: Current operational state
  - note: Load cursor agent or skill for the active stage

# ─────────────────────────────────────────────
# PIPELINE AGENTS (ordered by stage)
# ─────────────────────────────────────────────
agents:
  # Frontmatter fields (name, description, model, readonly, is_background) live in
  # each .cursor/agents/<id>.md file. Fields here are the manifest-level catalog.
  pipeline:
    - id: intent-analyst
      path: .cursor/agents/intent-analyst.md
      model: inherit
      readonly: false
      is_background: false
      role: Classifies request — always first (via Task)
    - id: planner
      path: .cursor/agents/planner.md
      model: inherit
      readonly: false
      is_background: false
      role: Epic + children on Plane
    - id: architect
      path: .cursor/agents/architect.md
      model: inherit
      readonly: false
      is_background: false
      role: Architecture notes on Plane
    - id: implementer
      path: .cursor/agents/implementer.md
      model: inherit
      readonly: false
      is_background: false
      role: Code + autonomous commits
    - id: qa
      path: .cursor/agents/qa.md
      model: inherit
      readonly: false
      is_background: false
      role: Lint, tests, doctor
    - id: auto-fixer
      path: .cursor/agents/auto-fixer.md
      model: inherit
      readonly: false
      is_background: false
      role: Fixes CI/lint failures (max 2 cycles)
    - id: reviewer
      path: .cursor/agents/reviewer.md
      model: inherit
      readonly: true
      is_background: false
      role: APPROVE | ESCALATE
    - id: devops
      path: .cursor/agents/devops.md
      model: inherit
      readonly: false
      is_background: false
      role: Push, PR, merge

  support:
    - id: doctor
      path: .cursor/agents/doctor.md
      model: fast
      readonly: true
      is_background: false
      role: Structural validation
    - id: observer
      path: .cursor/agents/observer.md
      model: fast
      readonly: false
      is_background: true
      role: Observability metrics (background)
    - id: issue-analyst
      path: .cursor/agents/issue-analyst.md
      model: fast
      readonly: false
      is_background: false
      role: GitHub Issues triage
    - id: sdlc-auditor
      path: .cursor/agents/sdlc-auditor.md
      model: inherit
      readonly: false
      is_background: false
      role: Autonomous SDLC audit
    - id: security-scanner
      path: .cursor/agents/security-scanner.md
      model: inherit
      readonly: true
      is_background: false
      role: SAST/secrets scanning
    - id: migration-runner
      path: .cursor/agents/migration-runner.md
      model: inherit
      readonly: false
      is_background: false
      role: Database migrations
    - id: contract-validator
      path: .cursor/agents/contract-validator.md
      model: fast
      readonly: true
      is_background: false
      role: OpenAPI ↔ TypeScript validation
    - id: rollback-agent
      path: .cursor/agents/rollback-agent.md
      model: inherit
      readonly: false
      is_background: false
      role: Rollback procedures

# ─────────────────────────────────────────────
# CRITICAL SKILLS (P0/P1)
# ─────────────────────────────────────────────
skills:
  - id: sdlc-orchestrator
    path: .cursor/skills/sdlc-orchestrator/SKILL.md
    when: Task coordination
  - id: subagent-delegation
    path: .cursor/skills/subagent-delegation/SKILL.md
    when: Orchestrator → Task matrix
  - id: plane-task-creation
    path: .cursor/skills/plane-task-creation/SKILL.md
    when: Creating epic + child cards on Plane
  - id: plane-sdlc
    path: .cursor/skills/plane-sdlc/SKILL.md
    when: Any Plane MCP operation
  - id: intent-classification
    path: .cursor/skills/intent-classification/SKILL.md
    when: Classify request intent
  - id: qa-minimum-checklist
    path: .cursor/skills/qa-minimum-checklist/SKILL.md
    when: Minimum validation checklist
  - id: start-change
    path: .cursor/skills/start-change/SKILL.md
    when: Open feature branch + Plane gate
  - id: finish-change
    path: .cursor/skills/finish-change/SKILL.md
    when: Merge PR + close Plane card

# ─────────────────────────────────────────────
# MCP INTEGRATIONS
# ─────────────────────────────────────────────
mcps:
  - id: plane
    config: .cursor/mcp.json
    skill: plane-sdlc
    description: Work items, evidence, Done status
  - id: github
    config: .cursor/mcp.json
    skill: github-sdlc
    description: PRs, CI status, merge

# ─────────────────────────────────────────────
# CURSOR COMMANDS
# ─────────────────────────────────────────────
commands:
  - id: sdlc-plan
    path: .cursor/commands/sdlc-plan.md
    purpose: Plan [AI][TYPE] card
  - id: sdlc-implement
    path: .cursor/commands/sdlc-implement.md
    purpose: Implementation task
  - id: sdlc-review
    path: .cursor/commands/sdlc-review.md
    purpose: PR review
  - id: sdlc-doctor
    path: .cursor/commands/sdlc-doctor.md
    purpose: Doctor validation
  - id: sdlc-audit
    path: .cursor/commands/sdlc-audit.md
    purpose: Full autonomy audit
  - id: sdlc-handoff
    path: .cursor/commands/sdlc-handoff.md
    purpose: Stage transition handoff

# ─────────────────────────────────────────────
# CONVENTIONS
# ─────────────────────────────────────────────
conventions:
  task_names: "[AI][EPIC|BACKEND|FRONTEND|INFRA|SHARED] Short imperative title"
  branch_pattern: "feature/INVES-N-<slug>  (also: bugfix/, sdlc/, hotfix/)"
  before_app_code: "workflow start --card INVES-M  (child card, never epic)"
  before_merge: "green CI + Reviewer APPROVE + finish-change skill"
  after_structural_change: "make sdlc-doctor"

# ─────────────────────────────────────────────
# PROHIBITIONS
# ─────────────────────────────────────────────
prohibitions:
  - Never create specs/ folder or local tickets/evidence
  - Orchestrator never implements, commits, lints, or runs tests directly
  - No single [AI][FULLSTACK] card for GREENFIELD or FEATURE intents
  - Never skip stages without an explicit documented reason

# ─────────────────────────────────────────────
# ESCALATE TO HUMAN (only these conditions)
# ─────────────────────────────────────────────
escalate_to_human:
  - AutoFixer exhausted 2 cycles and QA still fails
  - Reviewer returns ESCALATE
  - External blocker (Plane/GitHub/API unavailable)
  - Product decision outside card scope
