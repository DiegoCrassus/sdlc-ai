version: "1.0"
description: Skill definitions mapped to SDLC stages and expected outputs.

skills:
  - id: requirements-refinement
    name: Requirements Refinement
    stages: [ticket, requirements]
    description: Elicits, structures, and validates requirements from raw ideas.
    expected_outputs:
      - Scope statement
      - Assumptions list
      - Non-goals list
      - Risk registry

  - id: architecture-analysis
    name: Architecture Analysis
    stages: [architecture]
    description: Evaluates technical options and defines system boundaries.
    expected_outputs:
      - Technical approach
      - ADR entry
      - Impacted areas list

  - id: implementation
    name: Implementation
    stages: [implementation, deployment, autofix]
    description: Produces focused, reversible code changes with tests.
    expected_outputs:
      - Code diff
      - Test coverage
      - Docs update if needed

  - id: qa-validation
    name: QA Validation
    stages: [validation]
    description: Verifies acceptance criteria with real test evidence.
    expected_outputs:
      - Test results
      - Acceptance criteria verification
      - QA notes

  - id: code-review
    name: Code Review
    stages: [review]
    description: Reviews diffs for correctness, security, and maintainability.
    expected_outputs:
      - Review decision
      - Risk notes
      - Required fixes

  - id: observability
    name: Observability
    stages: [observability, incident]
    description: Defines and verifies logs, metrics, traces, and alerts.
    expected_outputs:
      - Observability checklist
      - Signal definitions

  - id: documentation
    name: Documentation
    stages: [ticket, requirements, architecture, implementation, deployment, review]
    description: Creates and synchronizes human-readable documentation.
    expected_outputs:
      - Updated docs
      - Handoff summary
