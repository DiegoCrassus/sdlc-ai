# SDLC phases — RPG-OP (AI-native)
version: 1

phases:
  - id: intent
    name: Intent
    description: Issue ou ADR descreve a mudança
    gate: GitHub Issue (template sdlc-intent) ou ADR
    artifact: .github/ISSUE_TEMPLATE/sdlc-intent.yml
    integration: github

  - id: spec
    name: Spec
    description: Editar DSL em specs/ ou agentes em .sdlc/agents/
    gate: rpg validate verde + branch linkada à issue
    owner: spec-author
    github_label: sdlc:spec

  - id: compile
    name: Compile
    description: rpg compile --target all
    gate: generated/ consistente; diff revisado
    owner: codegen-integrator

  - id: implement
    name: Implement
    description: Hooks manuais mínimos em backend/, apps/, services/
    gate: pytest + validate.ps1 verde
    owner: codegen-integrator
    github_label: sdlc:implement

  - id: eval
    name: Eval
    description: Cenários de agente (LangSmith / .sdlc/evals/)
    gate: smoke score >= 0.9
    owner: eval-engineer
    github_label: sdlc:eval
    required_from_phase: f2-agent

  - id: review
    name: Review
    description: PR + revisão humana + GitHub Actions SDLC
    gate: PR checks verdes; checklist preenchido
    owner: github-integrator

  - id: deploy
    name: Deploy
    description: Staging → produção
    gate: smoke pós-deploy
    integration: github_actions

current_maturity: L0
target_maturity: L2
