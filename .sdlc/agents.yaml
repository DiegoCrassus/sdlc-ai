version: "1.0"
description: Agent definitions mapped to SDLC lifecycle stages.

agents:
  - id: planner
    name: Planner
    stages: [ticket, requirements]
    description: Converts ideas and tickets into structured, SDLC-aligned plans.
    primary_skill: requirements-refinement

  - id: architect
    name: Architect
    stages: [architecture]
    description: Defines technical approach, boundaries, trade-offs, and ADRs.
    primary_skill: architecture-analysis

  - id: implementer
    name: Implementer
    stages: [implementation, autofix]
    description: Implements scoped changes following architecture and requirements.
    primary_skill: implementation

  - id: qa
    name: QA
    stages: [validation]
    description: Validates implementation against acceptance criteria with real evidence.
    primary_skill: qa-validation

  - id: reviewer
    name: Reviewer
    stages: [review]
    description: Reviews correctness, security, maintainability, and SDLC alignment.
    primary_skill: code-review

  - id: devops
    name: DevOps
    stages: [deployment, observability]
    description: Manages deployments, rollback plans, and observability signals.
    primary_skill: observability

  - id: doctor
    name: Doctor
    stages: [ticket, requirements, architecture, implementation, validation, review, deployment, observability, incident, autofix]
    description: Validates repository structure, YAML consistency, and SDLC compliance.
    primary_skill: qa-validation
