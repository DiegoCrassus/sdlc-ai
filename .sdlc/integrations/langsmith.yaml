platform: langsmith
version: 1
status: active

env:
  api_key: LANGCHAIN_API_KEY
  tracing: LANGCHAIN_TRACING_V2
  project_cursor: LANGCHAIN_PROJECT
  project_runtime: rpg-op
  endpoint: LANGCHAIN_ENDPOINT

cursor_hooks:
  config: .cursor/hooks.json
  library: .cursor/hooks/_lib/langsmith_emit.py
  local_log: .sdlc/logs/cursor-hooks.jsonl
  session_state: .sdlc/logs/.cursor-session.json
  requirements: .sdlc/requirements-hooks.txt

events:
  pre:
    - sessionStart
    - beforeSubmitPrompt
    - preToolUse
    - beforeShellExecution
    - beforeMCPExecution
  post:
    - sessionEnd
    - stop
    - postToolUse
    - postToolUseFailure
    - afterShellExecution
    - afterMCPExecution

run_naming: "cursor/{event}"

docs: .sdlc/integrations/langsmith.md
