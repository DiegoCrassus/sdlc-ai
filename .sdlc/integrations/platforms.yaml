# Roadmap de integrações — RPG-OP SDLC
version: 1

platforms:
  github:
    role: source_of_truth_code
    integration: .sdlc/integrations/github.yaml
    mcp: true
    status: active

  langsmith:
    role: cursor_hooks_and_agent_tracing
    integration: .sdlc/integrations/langsmith.yaml
    hooks: .cursor/hooks.json
    mcp: false
    status: active
    projects:
      cursor: rpg-op-cursor
      runtime: rpg-op

  plane:
    role: product_tracking_and_docs
    integration: .sdlc/integrations/plane.yaml
    mcp: true
    status: active

  supabase:
    role: database_and_project_docs
    integration: .sdlc/integrations/supabase.yaml
    mcp: true
    status: active
    mode: read_only

  linear:
    role: product_tracking
    mcp: planned
    status: backlog
    note: Opcional — Plane cobre backlog + docs

  docker:
    role: local_stack
    compose: infra/docker-compose.yml
    status: planned

  fly_railway:
    role: deploy_target
    status: backlog
    docs: docs/infrastructure/stack.md
