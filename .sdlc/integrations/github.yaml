platform: github
version: 1
status: active

mcp:
  cursor_config: .cursor/mcp.json
  example_config: .cursor/mcp.json.example
  server_url: https://api.githubcopilot.com/mcp/
  docker_image: ghcr.io/github/github-mcp-server
  token_env: GITHUB_PERSONAL_ACCESS_TOKEN
  docs: https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-cursor.md

cli:
  binary: gh
  repo_env: GITHUB_REPOSITORY

branching:
  default: main
  feature_prefix: feat/
  fix_prefix: fix/
  sdlc_prefix: sdlc/

labels:
  sdlc:
    - sdlc:intent
    - sdlc:spec
    - sdlc:implement
    - sdlc:eval
    - sdlc:ready
    - sdlc:blocked
  type:
    - type:feature
    - type:bug
    - type:spec
    - type:agent

issue_template: .github/ISSUE_TEMPLATE/sdlc-intent.yml
pr_template: .github/PULL_REQUEST_TEMPLATE.md
ci_workflow: .github/workflows/sdlc.yml

lifecycle:
  intent: create_issue
  spec: link_branch + label sdlc:spec
  implement: open_pr
  review: pr_checks + human
  merge: squash_to_main
  deploy: workflow_dispatch  # fase posterior
