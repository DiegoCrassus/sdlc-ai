# SDLC harness — RPG-OP
version: 1

project:
  name: rpg-op

paths:
  backend: apps/backend/
  frontend: apps/frontend/
  tests: tests/
  sdlc_skills: .sdlc/skills/
  sdlc_agents: .sdlc/agents/

deep_agent:
  dev_orchestrator: .sdlc/agents/dev-orchestrator.yaml
  default_model_env: AGENT_MODEL

commands:
  validate: ["bash", ".sdlc/scripts/validate.sh"]
  test_backend: ["pytest", "tests/", "-q"]
  smoke_api: ["python", "apps/backend/scripts/smoke_test.py"]

github:
  mcp_config: .cursor/mcp.json
  mcp_token_env: GITHUB_PERSONAL_ACCESS_TOKEN
  cli: gh
  lifecycle: .sdlc/workflows/github-lifecycle.md
  scripts:
    issue_intent: .sdlc/scripts/gh-issue-intent.sh
    pr_open: .sdlc/scripts/gh-pr-open.sh
    sdlc_status: .sdlc/scripts/gh-sdlc-status.sh
    labels_bootstrap: .sdlc/scripts/gh-labels-bootstrap.sh

plane:
  mcp_config: .cursor/mcp.json
  mcp_token_env: PLANE_API_KEY
  workspace_env: PLANE_WORKSPACE_SLUG
  lifecycle: .sdlc/workflows/plane-lifecycle.md
  scripts:
    mcp_check: .sdlc/scripts/plane-mcp-check.sh

supabase:
  mcp_config: .cursor/mcp.json
  mcp_token_env: SUPABASE_ACCESS_TOKEN
  project_ref_env: SUPABASE_PROJECT_REF
  integration: .sdlc/integrations/supabase.md
  read_only: true

integrations:
  registry: .sdlc/integrations/platforms.yaml
  github: .sdlc/integrations/github.yaml
  plane: .sdlc/integrations/plane.yaml
  supabase: .sdlc/integrations/supabase.yaml
  langsmith: .sdlc/integrations/langsmith.yaml

hooks:
  cursor: .cursor/hooks.json
  registry: .sdlc/hooks.yaml
  deps: .sdlc/requirements-hooks.txt
  local_log: .sdlc/logs/cursor-hooks.jsonl

gates:
  pr:
    - name: validate
      command: validate
      required: true
    - name: pytest
      command: test_backend
      required: true

policy:
  generated_readonly: false

cursor:
  rules_dir: .cursor/rules/
  project_skills_dir: .cursor/skills/
  mcp_config: .cursor/mcp.json
  hooks: .cursor/hooks.json
