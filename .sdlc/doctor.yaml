version: "2.0"
description: Doctor validation rules for the SDLC repository.

checks:
  directories:
    severity: required
    items:
      - .cursor
      - .cursor/rules
      - .cursor/commands
      - .cursor/skills
      - .cursor/agents
      - .cursor/hooks
      - .sdlc
      - .sdlc/dsl
      - .sdlc/memory
      - docs
      - docs/architecture
      - docs/infrastructure
      - docs/handoff
      - docs/roadmap
      - docs/operations
      - docs/sdlc
      - app
      - app/frontend
      - app/backend
      - app/infra
      - app/shared

  files:
    severity: required
    items:
      - AGENTS.md
      - .sdlc/manifest.yaml
      - .sdlc/sdlc.yaml
      - .sdlc/stages.yaml
      - .sdlc/pipeline.yaml
      - .sdlc/workflows.yaml
      - .sdlc/gate-paths.yaml
      - .sdlc/plane-granularity.yaml
      - .sdlc/rules.yaml
      - .sdlc/integrations.yaml
      - .sdlc/doctor.yaml
      - .sdlc/dsl/cli.py
      - .sdlc/dsl/doctor.py
      - .sdlc/dsl/gate.py
      - .sdlc/dsl/workflow.py
      - .sdlc/scripts/sdlc_gate.py
      - Makefile
      - README.md

  cursor:
    severity: required
    commands:
      - .cursor/commands/sdlc-doctor.md
      - .cursor/commands/sdlc-plan.md
      - .cursor/commands/sdlc-implement.md
      - .cursor/commands/sdlc-review.md
      - .cursor/commands/sdlc-handoff.md
    rules:
      - .cursor/rules/000-project-governance.mdc
      - .cursor/rules/001-sdlc-anti-bypass.mdc
      - .cursor/rules/002-sdlc-orchestrator-principal.mdc
      - .cursor/rules/010-ai-native-sdlc.mdc
      - .cursor/rules/020-code-quality.mdc
      - .cursor/rules/030-docs-and-handoff.mdc
      - .cursor/rules/040-doctor-gates.mdc
      - .cursor/rules/sdlc-core.mdc
    skills:
      - .cursor/skills/requirements-refinement.md
      - .cursor/skills/architecture-analysis.md
      - .cursor/skills/implementation.md
      - .cursor/skills/qa-validation.md
      - .cursor/skills/code-review.md
      - .cursor/skills/observability.md
      - .cursor/skills/documentation.md
      - .cursor/skills/intent-classification/SKILL.md
      - .cursor/skills/plane-task-creation/SKILL.md
      - .cursor/skills/sdlc-orchestrator/SKILL.md
      - .cursor/skills/start-change/SKILL.md
      - .cursor/skills/finish-change/SKILL.md
      - .cursor/skills/plane-sdlc/SKILL.md
    agents:
      - .cursor/agents/planner.md
      - .cursor/agents/architect.md
      - .cursor/agents/implementer.md
      - .cursor/agents/reviewer.md
      - .cursor/agents/qa.md
      - .cursor/agents/devops.md
      - .cursor/agents/doctor.md
      - .cursor/agents/intent-analyst.md
    hooks:
      - .cursor/hooks/pre-task.md
      - .cursor/hooks/post-task.md
      - .cursor/hooks/pre-review.md
      - .cursor/hooks/post-review.md
      - .cursor/hooks/sdlc_gate_hook.py

  docs:
    severity: required
    items:
      - docs/architecture/overview.md
      - docs/architecture/decisions.md
      - docs/architecture/system-context.md
      - docs/infrastructure/overview.md
      - docs/infrastructure/local-development.md
      - docs/infrastructure/deployment.md
      - docs/handoff/template.md
      - docs/handoff/current-state.md
      - docs/roadmap/roadmap.md
      - docs/operations/observability.md
      - docs/operations/incident-response.md
      - docs/operations/maintenance.md
      - docs/sdlc/ai-native-sdlc.md
      - docs/sdlc/workflows.md
      - docs/sdlc/gates.md
      - docs/sdlc/doctor.md
      - docs/sdlc/master-workflow.md
      - docs/sdlc/sdlc-workflow-gap-analysis.md

  yaml_validity:
    severity: required
    files:
      - .sdlc/sdlc.yaml
      - .sdlc/manifest.yaml
      - .sdlc/stages.yaml
      - .sdlc/pipeline.yaml
      - .sdlc/workflows.yaml
      - .sdlc/rules.yaml
      - .sdlc/integrations.yaml
      - .sdlc/doctor.yaml
      - .sdlc/gate-paths.yaml
      - .sdlc/plane-granularity.yaml

  # Non-empty checks for P0/P1 workflow enforcement files
  workflow_files:
    severity: required
    items:
      - AGENTS.md
      - .sdlc/manifest.yaml
      - docs/sdlc/master-workflow.md
      - .sdlc/gate-paths.yaml
      - .sdlc/plane-granularity.yaml
      - .sdlc/scripts/sdlc_gate.py
      - .sdlc/scripts/discovery_hook.py
      - .sdlc/dsl/gate.py
      - .sdlc/dsl/workflow.py
      - .sdlc/dsl/plane_granularity.py
      - .cursor/hooks/sdlc_gate_hook.py
      - .cursor/rules/001-sdlc-anti-bypass.mdc
      - .cursor/rules/002-sdlc-orchestrator-principal.mdc
      - .cursor/rules/003-orchestrator-delegation-only.mdc
      - .cursor/agents/intent-analyst.md
      - .cursor/skills/intent-classification/SKILL.md
      - .cursor/skills/plane-task-creation/SKILL.md
      - .cursor/skills/subagent-delegation/SKILL.md
      - .cursor/skills/qa-minimum-checklist/SKILL.md

  integrations:
    severity: warning
    items:
      - id: github
        env: GITHUB_PERSONAL_ACCESS_TOKEN_CLASSIC
      - id: plane
        env: PLANE_API_KEY
      - id: openai
        env: OPENAI_API_KEY

  makefile:
    severity: required
    targets:
      - sdlc-doctor
      - sdlc-validate
      - sdlc-stages
      - docs-check
      - workflow-status
      - workflow-discover

  python_dsl:
    severity: required
    importable: .sdlc/dsl/cli.py
