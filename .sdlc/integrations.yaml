version: "1.0"
description: Integration placeholders for future external service connections.

integrations:
  - id: github
    name: GitHub
    status: active
    description: Version control, PR workflow, and CI/CD triggers.
    config_env: GITHUB_PERSONAL_ACCESS_TOKEN_CLASSIC
    capabilities:
      - issues
      - pull_requests
      - actions
      - webhooks
    notes: MCP active via .cursor/mcp.json — npx @modelcontextprotocol/server-github

  - id: plane
    name: Plane
    status: active
    description: Project management — tasks, sprints, and pages.
    config_env: PLANE_API_KEY
    capabilities:
      - work_items
      - sprints
      - pages
    notes: MCP active via .cursor/mcp.json — uvx plane-mcp-server stdio. Project sdlc-investiment (SDLCINVEST). Workspace slug rpg.

  - id: openai
    name: OpenAI
    status: placeholder
    description: LLM inference for agent tasks.
    config_env: OPENAI_API_KEY
    capabilities:
      - chat_completion
      - embeddings
    notes: Model configured via AGENT_MODEL env var.

  - id: cicd
    name: CI/CD
    status: not_configured
    description: Automated build, test, and deployment pipeline.
    capabilities:
      - build
      - test
      - deploy
      - lint
    notes: Implement via GitHub Actions when backend/frontend exist.

  - id: docker
    name: Docker
    status: not_configured
    description: Container build and local development environment.
    capabilities:
      - build
      - compose
      - registry
    notes: Add docker-compose.yml when services are defined.

  - id: kubernetes
    name: Kubernetes
    status: not_configured
    description: Container orchestration for production deployment.
    capabilities:
      - deploy
      - scale
      - rollback
    notes: Implement when deployment target is defined.

  - id: opentelemetry
    name: OpenTelemetry
    status: not_configured
    description: Distributed tracing, metrics, and log correlation.
    capabilities:
      - traces
      - metrics
      - logs
    notes: Instrument backend services when implemented.

  - id: sentry
    name: Sentry
    status: not_configured
    description: Error tracking and performance monitoring.
    capabilities:
      - error_tracking
      - performance
      - alerts
    notes: Configure DSN when backend/frontend services exist.

  - id: slack
    name: Slack
    status: not_configured
    description: Team notifications and incident alerts.
    capabilities:
      - notifications
      - incident_alerts
    notes: Add webhook URL when communication workflow is defined.

  - id: email
    name: Email
    status: not_configured
    description: Transactional and alert email delivery.
    capabilities:
      - transactional
      - alerts
    notes: Configure SMTP or provider when user-facing features exist.
