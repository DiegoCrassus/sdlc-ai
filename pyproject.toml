[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-ai"
version = "0.1.0"
description = "AI-Native SDLC platform — SDLC operating system and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
market-data = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/backend/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
