[tool.ruff]
target-version = "py310"
line-length = 100

# Diretórios a verificar
include = [
    "apps/backend/**/*.py",
    ".cursor/hooks/**/*.py",
]

exclude = [
    ".venv/",
    "apps/backend/.venv/",
    "**/__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length — já tratado pelo formatter
    "B008",  # do not perform function calls in default args (FastAPI depends-on)
    "N999",  # invalid module name (specs usam CamelCase proposital)
]

[tool.ruff.lint.per-file-ignores]
"apps/backend/app/fixtures/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
